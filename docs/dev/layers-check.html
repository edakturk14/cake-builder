<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Development-only prepared sponge cylinder checks</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#fbf3ed;color:#482d2e;font:14px system-ui,sans-serif}h1{font:28px Georgia,serif;font-weight:400;margin:0 0 8px}p{margin:0 0 24px;color:#8b6d62}.grid{display:grid;grid-template-columns:repeat(3,512px);gap:12px 20px}.sample{height:490px;text-align:center}.sample h2{font-size:15px;font-weight:500;margin:0}.sample img{display:block;width:512px;height:470px;object-fit:cover;object-position:top}
</style>
<h1>Fixed-camera sponge layer checks</h1>
<p>Each column shares the same photographic top and pedestal. Sponge sides and filling follow one continuous curved cylinder.</p>
<div class="grid" id="samples"></div>
<script>
for(const flavor of ['chocolate','vanilla','lemon','red-velvet'])for(const layers of [1,2,3]){
const sample=document.createElement('section');sample.className='sample';
const title=document.createElement('h2');title.textContent=`${flavor.replace('-',' ')} · ${layers} ${layers===1?'layer':'layers'}`;
const image=document.createElement('img');image.src=`/art/${flavor}-${layers}.png`;image.alt=title.textContent;
sample.append(title,image);document.querySelector('#samples').append(sample);
}
</script>
</html>
