name: Cake Gallery checks

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser smoke (writing, layers, voice, layout)
        run: |
          npm install --no-save --ignore-scripts playwright@1.61.0
          npx playwright install --with-deps chromium
          npm run dev > /tmp/cake-gallery-dev.log 2>&1 &
          node tests/browser-smoke.mjs
          node tests/frosting-visual.mjs
      - name: Save cake screenshot for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cake-fruit-and-unicorn
          path: |
            screenshots/balanced-workbench.png
            screenshots/fruit-unicorn.png
            screenshots/message-white-icing-five-candles.png
            screenshots/message-white-icing-number-candle.png
            screenshots/vibrant-christmas-tree.png
            screenshots/lavender-smooth-top-1-layer.png
            screenshots/lavender-smooth-top-3-layers.png
            screenshots/frosting-white-smooth-top.png
            screenshots/frosting-lavender-smooth-top.png
          if-no-files-found: ignore
