name: Cake Gallery checks

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser smoke (writing, layers, voice, layout)
        run: |
          npm install --no-save --ignore-scripts playwright@1.61.0
          npx playwright install --with-deps chromium
          npm run dev > /tmp/cake-gallery-dev.log 2>&1 &
          node tests/browser-smoke.mjs
